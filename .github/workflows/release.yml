name: QStock Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qstock-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qstock-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/qstock-frontend:latest

      - name: Release summary
        run: |
          echo "Released QStock ${GITHUB_REF_NAME}"
          echo "Backend: ghcr.io/${GITHUB_REPOSITORY_OWNER}/qstock-backend:${GITHUB_REF_NAME#v}"
          echo "Frontend: ghcr.io/${GITHUB_REPOSITORY_OWNER}/qstock-frontend:${GITHUB_REF_NAME}"
