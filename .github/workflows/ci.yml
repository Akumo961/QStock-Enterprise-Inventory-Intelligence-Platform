name: QStock CI

on:
  push:
    branches: [main, "production/**", "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile check
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Validate Docker Compose
        run: docker compose config
        env:
          POSTGRES_DB: qr_inventory
          POSTGRES_USER: qr_admin
          POSTGRES_PASSWORD: ci-placeholder-password
          DATABASE_URL: postgresql://qr_admin:ci-placeholder-password@postgres:5432/qr_inventory
          SECRET_KEY: ci-placeholder-secret-key
          ALLOWED_ORIGINS: http://localhost
          INITIAL_ADMIN_EMAIL: admin@test.com
          INITIAL_ADMIN_PASSWORD: TestPassword123!
          INITIAL_ADMIN_NAME: CI Admin
          INITIAL_ADMIN_PHONE: "0000000000"
          APP_NAME: QStock
          APP_VERSION: 1.0.0


      - name: Build Docker images
        run: |
          docker compose build


      - name: Verify images
        run: |
          docker images | grep qstock