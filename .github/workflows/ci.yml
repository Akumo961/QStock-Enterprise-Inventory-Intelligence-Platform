name: QStock CI

on:
  push:
    branches: [main, "production/**", "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile check
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          SECRET_KEY: ci-placeholder-secret-key
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t qstock-backend:ci backend
